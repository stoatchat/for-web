    onbeforeinstallprompt = (e) => {
      if (typeof window._PwaP === "function") window._PwaP(e);
      window._PwaP = e;
    }
    onappinstalled = () => {
      if (typeof window._PwaI === "function") window._PwaI(true);
      window._PwaI = true;
    }
  </script>
